<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../imagenes\iconos\store.svg" type="image/png">
  <title>mini-marketplace</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <header>
    <div class="header">
      <div class="images-header">
        <img src="../imagenes/iconos/store.svg" class="store" alt="Logo tienda" />
      </div>
      <h1>G & E </h1>
      <div class="carrito-contenedor ">
        <img src="../imagenes/iconos/carrito.svg" class="carrito" alt="Carrito" />
        <span class="notificacion"></span>
      </div>
    </div>

  </header>
  <main>

    <section class="busqueda">
      <input type="text" placeholder="Buscar productos" id="buscador">
      <select class="opciones" id="categoriaOpciones">
        <option value="" id="opciones">Todas las categorias</option>
      </select>


    </section>
    <!-- Caja de productos -->
    <section class="productos">
    </section>

    </section>
  </main>

  <footer>
    <p>Siguenos en nuestras redes sociales</p>
    <div class="redes">
      <img src="../imagenes/iconos/twitter.svg" class="iconos" />
      <img src="../imagenes/iconos/instagram.svg " class="iconos" />
      <img src="../imagenes/iconos/tik-tok.svg" class="iconos" />
    </div>
    <p> &copy; 2024 My Market. Todos los derechos reservados.</p>
    <p> Politica de privacidad | Términos de uso | Contacto</p>
  </footer>

  <script type="module" src="./main.js"></script>
</body>

</html>
<script type="module" src="./public/js/main.js"></script>
</body>

</html>
